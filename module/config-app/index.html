<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HT VIP Unlock</title>
<style>
/* ===== Liquid Glass 配置页 =====
   风格来源: Desktop\工程文件2\Liquid_Glass_交互控件实施手册.md
   - 胶囊开关: 关=凹陷暗坑, 开=强调色浸润 + 滑块压缩回弹
   - 卡片: 低饱和玻璃基底, 内阴影, 高光边 */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  font-family:-apple-system,"HarmonyOS Sans SC","MiSans",sans-serif;
  background:linear-gradient(160deg,#0f1420 0%,#1a2233 55%,#141a2a 100%);
  color:#e8ecf4; overflow-x:hidden;
  display:flex; justify-content:center;
}
.wrap { width:100%; max-width:420px; padding:20px 18px 40px; }

/* 顶部标题玻璃条 */
.hero {
  position:relative; padding:22px 20px; border-radius:24px;
  background:linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -8px 18px rgba(0,0,0,.22), 0 14px 34px rgba(0,0,0,.4);
  overflow:hidden; margin-bottom:22px;
}
.hero::after { /* 高光弧 */
  content:""; position:absolute; top:-40%; left:-20%; width:70%; height:120%;
  background:radial-gradient(ellipse at center, rgba(255,255,255,.14), transparent 65%);
  transform:rotate(-18deg); pointer-events:none;
}
.hero h1 { font-size:19px; font-weight:700; letter-spacing:.5px; }
.hero p  { font-size:12px; color:#9aa7bd; margin-top:5px; }
.hero .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
  background:#39d98a; box-shadow:0 0 8px #39d98a; margin-right:6px; }

/* 分组标题 */
.sec { font-size:12px; color:#7d8aa3; letter-spacing:2px; margin:22px 4px 10px; }

/* 玻璃卡片行 */
.card {
  position:relative; border-radius:20px; margin-bottom:12px; overflow:hidden;
  background:linear-gradient(150deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 8px 22px rgba(0,0,0,.28);
}
.row { display:flex; align-items:center; padding:16px 18px; gap:14px; }
.row .txt { flex:1; min-width:0; }
.row .name { font-size:15px; font-weight:600; }
.row .desc { font-size:11.5px; color:#8b97ad; margin-top:4px; line-height:1.45; }

/* 图标圆牌 */
.ico { width:38px; height:38px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:18px;
  background:linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
}

/* ===== 液态胶囊开关 =====
   关: 轨道内凹暗坑; 开: 强调色流体涌入 + 滑块 snap 压缩 */
.tg { position:relative; width:52px; height:30px; flex-shrink:0; cursor:pointer; }
.tg input { display:none; }
.tg .track {
  position:absolute; inset:0; border-radius:16px;
  background:rgba(0,0,0,.38);                                  /* 凹陷暗坑 */
  box-shadow: inset 0 2px 6px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.06);
  transition:background .35s cubic-bezier(.34,1.3,.5,1);
  overflow:hidden;
}
.tg .fluid {  /* 强调色流体: 开时从底部涌入 */
  position:absolute; inset:0; border-radius:16px;
  background:linear-gradient(120deg,#2f7bff,#39d98a);
  opacity:0; transform:scale(.6,.4); transform-origin:70% 100%;
  transition:all .38s cubic-bezier(.34,1.4,.44,1);
}
.tg .thumb {
  position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
  background:linear-gradient(145deg,#fdfdff,#c9d2e2);
  box-shadow: 0 2px 6px rgba(0,0,0,.45), inset 0 -2px 3px rgba(0,0,0,.12), inset 0 1px 1px #fff;
  transition:left .32s cubic-bezier(.34,1.45,.44,1), transform .18s ease;
}
.tg:active .thumb { transform:scaleX(1.4); }                    /* hold: 水滴压扁拉长 */
.tg input:checked ~ .track .fluid { opacity:1; transform:scale(1,1); }
.tg input:checked ~ .track .thumb { left:25px; }
.tg input:checked:active ~ .track .thumb { transform:scaleX(.85) scaleY(1.15); } /* snap 压缩 */

/* 日志卡片 */
.log {
  margin-top:22px; border-radius:18px; padding:14px 16px;
  background:rgba(0,0,0,.30); border:1px solid rgba(255,255,255,.08);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.4);
  font:11px/1.7 "Cascadia Code",monospace; color:#7fd4a8;
  max-height:180px; overflow-y:auto; white-space:pre-wrap; word-break:break-all;
}
.foot { text-align:center; font-size:10.5px; margin-top:18px; color:#5a6680; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1><span class="dot"></span>HT VIP Unlock</h1>
    <p>LSPosed module for HelloTalk 6.4.40 · v1.3</p>
  </div>

  <div class="sec">功能开关</div>
  <div class="card">
    <div class="row">
      <div class="ico">👑</div>
      <div class="txt">
        <div class="name">VIP 状态解锁</div>
        <div class="desc">谁看过我 / 附近的人 / 搜索筛选 / 翻译无限</div>
      </div>
      <label class="tg"><input type="checkbox" id="sw_vip" checked><div class="track"><div class="fluid"></div><div class="thumb"></div></div></label>
    </div>
    <div class="row">
      <div class="ico">✨</div>
      <div class="txt">
        <div class="name">VIP 角标（本机）</div>
        <div class="desc">头像终身 VIP 标识，仅自己可见</div>
      </div>
      <label class="tg"><input type="checkbox" id="sw_badge" checked><div class="track"><div class="fluid"></div><div class="thumb"></div></div></label>
    </div>
    <div class="row">
      <div class="ico">🏠</div>
      <div class="txt">
        <div class="name">语聊房 Tab</div>
        <div class="desc">UI 可见，列表受服务端区域限制</div>
      </div>
      <label class="tg"><input type="checkbox" id="sw_voice" checked><div class="track"><div class="fluid"></div><div class="thumb"></div></div></label>
    </div>
    <div class="row">
      <div class="ico">🛡️</div>
      <div class="txt">
        <div class="name">消息防撤回</div>
        <div class="desc">拦截 msgs_delete 本地删除（副作用：多端删除同步失效）</div>
      </div>
      <label class="tg"><input type="checkbox" id="sw_revoke" checked><div class="track"><div class="fluid"></div><div class="thumb"></div></div></label>
    </div>
  </div>

  <div class="sec">Hook 日志</div>
  <div class="log" id="log">读取中…</div>
  <div class="foot">com.coldcoffee.htvip · 仅供学习研究</div>
</div>

<script>
// 开关状态持久化: 模块内 XSharedPreferences 读 /data/data/com.coldcoffee.htvip/shared_prefs/htvip.xml
const KEYS = { sw_vip:'vip', sw_badge:'badge', sw_voice:'voice', sw_revoke:'revoke' };
const $ = id => document.getElementById(id);

// 初始化: 从 SharedPreferences 桥读取（由 App 注入 window._prefs）
function loadPrefs() {
  let prefs = window._prefs || {};
  for (const [id, key] of Object.entries(KEYS)) {
    $(id).checked = prefs[key] !== false;   // 默认全开
  }
}
function savePrefs() {
  const out = {};
  for (const [id, key] of Object.entries(KEYS)) out[key] = $(id).checked;
  // Android WebView 桥: App 拦截保存到 SharedPreferences
  if (window.HTBridge && window.HTBridge.save) window.HTBridge.save(JSON.stringify(out));
  log('已保存: ' + JSON.stringify(out));
}
function log(msg) {
  const el = $('log');
  const t = new Date().toTimeString().slice(0,8);
  el.textContent = `[${t}] ${msg}\n` + el.textContent;
}
for (const id of Object.keys(KEYS)) $(id).addEventListener('change', savePrefs);
window.addEventListener('load', () => {
  loadPrefs();
  log('配置已加载');
});
</script>
</body>
</html>
